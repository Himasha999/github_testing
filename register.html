<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | Bloom & Blossom</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">🌸 Bloom <span>&</span> Blossom</a>
    <ul class="nav-links">
      <li><a href="index.html">Home Catalog</a></li>
      <li><a href="cart.html">Cart 🛒 <span class="cart-badge">0</span></a></li>
    </ul>
    <div id="user-nav-slot"></div>
  </nav>

  <main class="main-container">
    <div class="auth-card">
      <h2 style="font-size: 2rem; margin-bottom: 0.5rem; text-align: center; color: var(--primary);">Create Account</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Join Bloom & Blossom for exclusive flower offers.</p>

      <div id="reg-error" style="display: none; background: #fff5f5; color: #e53e3e; padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; border: 1px solid #feb2b2;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Kasun Perera" required>
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register Account</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign In</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Bloom & Blossom Flower Shop</p>
  </footer>

  <script type="module">
    import { Auth } from './js/auth.js';
    import { Cart } from './js/app.js';

    document.addEventListener('DOMContentLoaded', () => {
      Auth.updateNavUI();
      Cart.updateCartBadge();

      const form = document.getElementById('register-form');
      const errBox = document.getElementById('reg-error');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        const res = Auth.register(name, email, password);
        if (res.success) {
          window.location.href = 'index.html';
        } else {
          errBox.textContent = res.message;
          errBox.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
